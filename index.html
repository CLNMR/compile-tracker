<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0a13" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Track your games of Compile and compile the stats." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Compile" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Compile Tracker</title>
    <script>
      // Browser visits on the Firebase default domains move to the main domain (same path, query and hash).
      // Installed apps keep running where they were installed; their data lives in that origin's storage.
      (function () {
        var target = '%VITE_CANONICAL_ORIGIN%';
        var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        if (/^https:\/\//.test(target) && /\.(web\.app|firebaseapp\.com)$/.test(location.hostname) && !standalone) {
          location.replace(target + location.pathname + location.search + location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
